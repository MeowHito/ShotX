services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eventdd
      POSTGRES_PASSWORD: eventdd
      POSTGRES_DB: eventdd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shotx-local
      MINIO_ROOT_PASSWORD: shotx-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 shotx-local shotx-local-secret; do sleep 2; done;
      mc mb --ignore-existing local/shotx-local;
      mc anonymous set download local/shotx-local;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
