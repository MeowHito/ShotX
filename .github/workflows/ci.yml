name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  CDK_DISABLE_CLI_TELEMETRY: 'true'

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Rekognition rate-limiter tests (packages/face) run against a real Redis.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # packages/db integration tests (skipped without TEST_DATABASE_URL). Same major as RDS
      # (infra/cdk.json database.engineVersion). ltree ships in the image's contrib modules; the
      # migrations run CREATE EXTENSION themselves, as they do on RDS.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shotx
          POSTGRES_PASSWORD: shotx
          POSTGRES_DB: shotx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shotx -d shotx_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://shotx:shotx@localhost:5432/shotx_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/worker video tests run ffmpeg and ffprobe (skipped without them).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm turbo run lint typecheck test

  images:
    name: Docker image (${{ matrix.app }}, linux/arm64)
    runs-on: ubuntu-latest
    # Cross-builds under QEMU, one app per job in parallel; layers cached in the GHA cache.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Dockerfile lint (BuildKit build checks); fails on any warning.
      - name: Check Dockerfile
        run: docker buildx build --check -f apps/${{ matrix.app }}/Dockerfile .
      # Same platform as ECS (infra/cdk.json services.cpuArchitecture). Built, never pushed.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  synth:
    name: CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Offline: no AWS credentials and no context lookups. Placeholders come from infra/cdk.json.
      - run: pnpm --filter @shotx/infra run synth
